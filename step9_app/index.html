<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gorkanai — Duygu Analizi</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; background: #fafafa; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  textarea { width: 100%; box-sizing: border-box; min-height: 110px; padding: 10px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
  button { margin-top: 10px; padding: 10px 20px; font: inherit; border: 0; border-radius: 8px; background: #333; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  #result { margin-top: 24px; padding: 16px; border-radius: 8px; background: #fff; border: 1px solid #ddd; }
  .label { font-size: 1.3rem; font-weight: 600; }
  .pozitif { color: #1a7f37; }
  .negatif { color: #c62828; }
  .nötr { color: #8a6d00; }
  .bars { margin-top: 12px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: .85rem; }
  .bar-row .name { width: 60px; color: #666; }
  .bar-row .pct { width: 42px; text-align: right; color: #666; }
  .bar { flex: 1; height: 10px; border-radius: 5px; background: #eee; overflow: hidden; }
  .bar div { height: 100%; }
  .examples button { background: #e8e8e8; color: #333; padding: 6px 10px; font-size: .85rem; margin: 4px 4px 0 0; }
</style>
</head>
<body>
<h1>gorkanai</h1>
<p class="sub">Türkçe ürün yorumu duygu analizi — BERT, ~17.000 gerçek + elle etiketli yorumla eğitildi (3 sınıf: pozitif/nötr/negatif)</p>

<textarea id="text" placeholder="Bir yorum yaz..."></textarea>
<div class="examples">
  <button type="button">Kargo çok hızlıydı, ürün harika!</button>
  <button type="button">İade etmek zorunda kaldım, hiç memnun değilim.</button>
  <button type="button">Fiyatına göre idare eder.</button>
  <button type="button">Ürün bugün elime ulaştı.</button>
</div>
<button id="go">Analiz et</button>

<div id="result" hidden></div>

<script>
  const textEl = document.getElementById("text");
  const goEl = document.getElementById("go");
  const resultEl = document.getElementById("result");

  document.querySelectorAll(".examples button").forEach(b =>
    b.addEventListener("click", () => { textEl.value = b.textContent; analyze(); }));
  goEl.addEventListener("click", analyze);

  async function analyze() {
    const text = textEl.value.trim();
    if (!text) return;
    goEl.disabled = true;
    try {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      const data = await res.json();
      const colors = { pozitif: "#1a7f37", nötr: "#8a6d00", negatif: "#c62828" };
      const order = ["pozitif", "nötr", "negatif"];
      const bars = order.map(name => {
        const p = data.probabilities[name];
        return `<div class="bar-row">
          <span class="name">${name}</span>
          <div class="bar"><div style="width:${p * 100}%; background:${colors[name]}"></div></div>
          <span class="pct">%${(p * 100).toFixed(1)}</span>
        </div>`;
      }).join("");
      resultEl.innerHTML = `
        <div class="label ${data.label}">${data.label.toUpperCase()}</div>
        <div>Güven: %${(data.confidence * 100).toFixed(1)}</div>
        <div class="bars">${bars}</div>`;
      resultEl.hidden = false;
    } catch (e) {
      resultEl.textContent = "Hata: sunucuya ulaşılamadı.";
      resultEl.hidden = false;
    } finally {
      goEl.disabled = false;
    }
  }
</script>
</body>
</html>
